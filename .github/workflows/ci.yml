name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx python-multipart markdown pytest \
                      python-docx python-pptx openpyxl
      - name: Run tests
        run: pytest tests/ -v

  # NOTE: `docker build` is intentionally NOT run in CI. The image pulls in
  # LibreOffice + CJK fonts (~1.6 GB) and takes many minutes; the app logic is
  # covered by the unit/API tests above. Build verification is done locally.
